plugins {
    id 'com.android.application'
}

// Version : passée par le workflow (-PversionName=0.1.0-prototype -PversionCode=12), sinon celle-ci
def nomVersion = project.findProperty('versionName') ?: '0.1.0-prototype'
def codeVersion = (project.findProperty('versionCode') ?: '1').toString().toInteger()

android {
    namespace 'fr.archipel.jeu'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.archipel.jeu'
        minSdk 26
        targetSdk 35
        versionCode codeVersion
        versionName nomVersion
    }

    // Signature FIXE (sinon chaque construction a sa clé de débogage et Android refuse la mise à jour :
    // « conflit de package ») : clé PKCS12 déposée par le workflow depuis les secrets du dépôt
    // (ARCHIPEL_SIGNATURE_P12, ARCHIPEL_SIGNATURE_MDP) dans android/signature.p12, jamais versionnée
    def cle = rootProject.file('signature.p12')
    def mdp = System.getenv('ARCHIPEL_SIGNATURE_MDP')
    signingConfigs {
        archipel {
            storeFile cle
            storeType 'pkcs12'
            storePassword mdp
            keyAlias 'archipel'
            keyPassword mdp
        }
    }

    buildTypes {
        debug {
            if (cle.exists() && mdp) signingConfig signingConfigs.archipel
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
